name: claritybs
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clarity
      POSTGRES_DB: claritybs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clarity -d claritybs"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  migrate:
    build: .
    env_file: .env
    command: [python, -m, app.cli, init-db]
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private, edge]
  worker:
    build: .
    env_file: .env
    command: [python, -m, app.worker]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-claritybs.in}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  private:
  edge:
